<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var isDark =
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (saved === 'system') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        } catch (e) {}

        // Suppress benign third-party/extension-injected errors (e.g. Chrome Soft Navigation startTime bug and contentscript EventEmitter warnings)
        window.addEventListener('error', function (event) {
          var msg = event.message || '';
          var filename = event.filename || '';
          if (
            msg.indexOf('startTime') !== -1 ||
            msg.indexOf('reportAllChanges') !== -1 ||
            filename.indexOf('contentscript') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = (event.reason && (event.reason.message || event.reason.stack)) || '';
          if (typeof reason === 'string' && (reason.indexOf('startTime') !== -1 || reason.indexOf('reportAllChanges') !== -1)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        // Filter out known noisy third-party extension logs in console.warn/error
        var origWarn = console.warn;
        console.warn = function () {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string') {
            if (
              firstArg.indexOf('MaxListenersExceededWarning') !== -1 ||
              firstArg.indexOf('ObjectMultiplex') !== -1 ||
              firstArg.indexOf('contentscript') !== -1
            ) {
              return;
            }
          }
          origWarn.apply(console, arguments);
        };
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./logo.svg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14111F" />
    <meta name="description" content="Two-Do — Collaborative Tasks & Notes" />
    <title>Two-Do</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
