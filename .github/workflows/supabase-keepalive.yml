name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 06:00 UTC every 3 days (well within Supabase's 7-day inactivity window)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab anytime

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query to PostgREST
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY in GitHub Secrets!"
            exit 1
          fi

          echo "Sending query to Supabase database..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${SUPABASE_URL}/rest/v1/tasks?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Supabase HTTP Response: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Keep-alive ping successful. Supabase project activity recorded."
          else
            echo "::warning::Received unexpected HTTP status: $HTTP_STATUS"
            exit 1
          fi
